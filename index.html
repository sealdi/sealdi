<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de Oftalmología</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Software de Consulta de Oftalmología</h1>
        <p>
          Registra al paciente, abre la consulta y se imprimen automáticamente
          las prescripciones de gafas y lentes de contacto.
        </p>
      </header>

      <form id="consulta-form" class="card">
        <h2>Datos del paciente</h2>
        <div class="grid">
          <label>
            Nombre completo
            <input name="nombre" required />
          </label>
          <label>
            Documento
            <input name="documento" required />
          </label>
          <label>
            Edad
            <input name="edad" type="number" min="0" max="120" required />
          </label>
          <label>
            Fecha de consulta
            <input name="fecha" type="date" required />
          </label>
        </div>

        <h3>Prescripción de gafas</h3>
        <div class="grid">
          <label>
            OD Esfera
            <input name="gafas_od_esfera" required />
          </label>
          <label>
            OD Cilindro
            <input name="gafas_od_cilindro" required />
          </label>
          <label>
            OD Eje
            <input name="gafas_od_eje" required />
          </label>
          <label>
            OI Esfera
            <input name="gafas_oi_esfera" required />
          </label>
          <label>
            OI Cilindro
            <input name="gafas_oi_cilindro" required />
          </label>
          <label>
            OI Eje
            <input name="gafas_oi_eje" required />
          </label>
          <label>
            Distancia pupilar
            <input name="gafas_dp" required />
          </label>
          <label>
            Observaciones
            <input name="gafas_obs" />
          </label>
        </div>

        <h3>Prescripción de lentes de contacto</h3>
        <div class="grid">
          <label>
            OD Base curva
            <input name="lc_od_bc" required />
          </label>
          <label>
            OD Diámetro
            <input name="lc_od_diametro" required />
          </label>
          <label>
            OD Potencia
            <input name="lc_od_potencia" required />
          </label>
          <label>
            OI Base curva
            <input name="lc_oi_bc" required />
          </label>
          <label>
            OI Diámetro
            <input name="lc_oi_diametro" required />
          </label>
          <label>
            OI Potencia
            <input name="lc_oi_potencia" required />
          </label>
          <label>
            Marca recomendada
            <input name="lc_marca" required />
          </label>
          <label>
            Reemplazo
            <input name="lc_reemplazo" placeholder="Mensual / Diario / Anual" required />
          </label>
        </div>

        <button type="submit">Abrir consulta e imprimir prescripciones</button>
      </form>

      <section id="estado" class="card hidden">
        <h2>Consulta abierta</h2>
        <p id="mensaje-estado"></p>
        <button id="reimprimir" type="button">Reimprimir prescripciones</button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
